[project]
name = "opspilot-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.35.0",
  "PyYAML>=6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.bandit]
exclude_dirs = ["tests"]
